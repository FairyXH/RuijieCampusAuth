[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ruijie-campus-auth-hxxy"
version = "0.9.0"
description = "Cross-platform Ruijie-compatible EAP-MD5 campus network supplicant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scapy>=2.6,<3"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11", "pillow>=10", "pywin32>=306"]

[project.urls]
Homepage = "https://github.com/FairyXH/RuijieCampusAuth"
Repository = "https://github.com/FairyXH/RuijieCampusAuth.git"

[project.scripts]
ruijie-auth = "ruijie_auth.cli:main"
ruijie-auth-menu = "ruijie_auth.menu:run_menu"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
