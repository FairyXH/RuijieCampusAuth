[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ruijie-campus-auth-hxxy"
version = "0.8.0"
description = "Cross-platform Ruijie-compatible EAP-MD5 campus network supplicant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scapy>=2.6,<3"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8"]
build = ["pyinstaller>=6.11", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/FairyXH/ruijie-campus-auth-hxxy"
Repository = "https://github.com/FairyXH/ruijie-campus-auth-hxxy.git"

[project.scripts]
ruijie-auth = "ruijie_auth.cli:main"

[project.gui-scripts]
ruijie-auth-gui = "ruijie_auth.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
